<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录结果 | HTTP 学习站</title>
    <style>
:root{color-scheme:light;--ink:#17283a;--muted:#66788b;--blue:#285bd4;--border:#dce6ef;--paper:#fff;--bg:#f4f7fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}button,input{font:inherit}
.shell{max-width:1080px;margin:auto;padding:0 28px}.top{background:#fff;border-bottom:1px solid var(--border)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:.01em}.brand-icon{display:grid;place-items:center;width:34px;height:34px;background:#285bd4;color:white;border-radius:10px;font-size:15px}.nav-links{display:flex;gap:25px;color:#53677b;font-size:14px}.nav-links a:hover,.back:hover{color:var(--blue)}
main{padding:48px 0 72px}.eyebrow{color:var(--blue);font-size:12px;letter-spacing:.12em;font-weight:800}.hero{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:42px;padding:8px 0 44px}.hero h1{font-size:clamp(34px,5vw,52px);line-height:1.15;letter-spacing:-.04em;margin:14px 0 18px}.hero p{max-width:540px;color:var(--muted);margin:0;font-size:16px}.hero-note{margin-top:24px;color:#718294;font-size:13px}.diagram{background:#172d48;border-radius:20px;padding:27px;color:white;box-shadow:0 18px 45px #2643651c}.diagram-label{font-size:11px;color:#aebed1;letter-spacing:.12em;font-weight:700}.diagram-row{display:flex;align-items:center;gap:10px;margin:24px 0}.node{flex:1;text-align:center;border:1px solid #526b86;border-radius:12px;padding:12px 8px;font-size:13px}.arrow{color:#8fb5ff;font-size:21px}.diagram-code{border-top:1px solid #3e536d;padding-top:18px;color:#c9d9ed;font:13px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace}.diagram-code span{color:#a8d6aa}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 0 18px}.section-head h2{font-size:22px;letter-spacing:-.02em;margin:0}.section-head p{margin:0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 6px 22px #223d5b08}.card-top{display:flex;align-items:center;gap:10px}.tag{background:#edf3ff;color:#315dc0;font:700 11px ui-monospace,monospace;border-radius:6px;padding:4px 7px}.card h3{font-size:17px;margin:0}.card p{color:var(--muted);font-size:14px;margin:10px 0 18px}.form-row{display:flex;gap:9px}input{min-width:0;width:100%;border:1px solid #d3deea;background:#fff;border-radius:9px;padding:10px 12px;color:var(--ink);outline:none}input:focus{border-color:#6390ef;box-shadow:0 0 0 3px #285bd41a}button,.button{border:0;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;background:var(--blue);color:#fff;border-radius:9px;padding:10px 17px;font-weight:650;cursor:pointer}button:hover,.button:hover{background:#204ab0}.links{display:flex;gap:18px;color:var(--blue);font-size:14px;font-weight:650}.links a:hover{text-decoration:underline}.route{color:#8b99a8;font:12px ui-monospace,monospace;margin-top:15px}
.footer{border-top:1px solid var(--border);color:#8a9aaa;font-size:12px;padding:21px 0}.center-wrap{max-width:470px;margin:24px auto 0}.back{display:inline-block;color:#718294;font-size:14px;margin-bottom:20px}.page-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:36px;box-shadow:0 12px 40px #223d5b0c}.page-card h1{font-size:29px;letter-spacing:-.03em;line-height:1.2;margin:12px 0}.page-card p{color:var(--muted);font-size:14px;margin:0 0 24px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.full{width:100%;margin-top:6px}.page-hint{border-top:1px solid #e8eef4;margin-top:24px;padding-top:19px;color:#8190a0;font-size:13px}.page-hint a{color:var(--blue);font-weight:650}.status-num{font-size:66px;color:var(--blue);font-weight:800;line-height:1;letter-spacing:-.06em}.status-card{text-align:center;padding:48px 32px}.status-card p{margin-bottom:26px}
@media(max-width:700px){.shell{padding:0 20px}.nav{height:64px}.nav-links{gap:15px}.hero{grid-template-columns:1fr;gap:28px;padding-bottom:32px}.hero h1{font-size:36px}.grid{grid-template-columns:1fr}.section-head{display:block}.section-head p{margin-top:5px}main{padding-top:34px}.page-card{padding:28px}.diagram{padding:22px}}@media(max-width:390px){.nav-links{gap:10px;font-size:12px}.brand{font-size:14px}.form-row{flex-direction:column}.form-row button{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="shell nav"><a class="brand" href="/"><span class="brand-icon">H</span><span>HTTP 学习站</span></a><nav class="nav-links" aria-label="主导航"><a href="/">首页</a><a href="/login.html">登录</a><a href="/register.html">注册</a></nav></div></header>
<main class="shell"><div class="center-wrap"><section class="page-card status-card"><div class="eyebrow">REQUEST COMPLETE</div><h1>登录请求已处理</h1><p>服务器已收到你的请求。当前仅为演示，实际用户验证尚未实现。</p><a class="button" href="/">返回首页</a></section></div></main>
<footer class="footer"><div class="shell">HTTP 学习站 · 从请求到响应，动手理解网络</div></footer>
</body>
</html>
